name: tutim-classic
services:
  api:
    build: .
    command: npm run server
    env_file: .env
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://host.docker.internal:27017/tutim}
      PORT: 3000
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./server/public:/app/server/public
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
  client:
    build: .
    command: npm start
    environment:
      API_PROXY_TARGET: http://api:3000
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      api:
        condition: service_healthy
